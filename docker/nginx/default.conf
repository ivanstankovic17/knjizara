# nginx ispred PHP-FPM-a i Reverba (odeljak 16.5).

# HTTP samo preusmerava na HTTPS.
server {
    listen 80;
    server_name _;
    return 301 https://$host:8443$request_uri;
}

server {
    listen 443 ssl;
    http2 on;
    server_name _;

    # U produkciji: sertifikat od Let's Encrypt-a. Lokalno: samopotpisan,
    # napravljen komandom iz odeljka 16.5.
    ssl_certificate     /etc/nginx/certs/knjizara.crt;
    ssl_certificate_key /etc/nginx/certs/knjizara.key;
    ssl_protocols TLSv1.2 TLSv1.3;

    # nginx adresu iz proxy_pass/fastcgi_pass razrešava jednom, pri
    # pokretanju. Kada se kontejner app ponovo napravi, dobije novu IP
    # adresu, a nginx bi slao zahteve na staru (502). Sa promenljivom i
    # Docker-ovim DNS-om (127.0.0.11) ime se razrešava ponovo.
    resolver 127.0.0.11 valid=10s;
    set $php app:9000;
    set $reverb http://reverb:8080;

    root /var/www/knjizara/public;
    index index.php;
    client_max_body_size 2m;
    server_tokens off;

    # Fajlovi iz Vite-a imaju otisak sadržaja u imenu (app-Bj6FmwmM.css),
    # pa smeju da se keširaju godinu dana: nova verzija ima novo ime.
    location /build/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # WebSocket veze idu Reverbu (glava 10).
    location /app {
        proxy_pass $reverb;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_read_timeout 120s;
    }

    # Statički fajl ako postoji (public/docs/api.json), inače Laravel.
    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location ~ \.php$ {
        try_files $uri =404;
        fastcgi_pass $php;
        fastcgi_param SCRIPT_FILENAME /var/www/knjizara/public$fastcgi_script_name;
        include fastcgi_params;
    }

    # Skriveni fajlovi (.env, .git) se nikad ne isporučuju.
    location ~ /\. {
        deny all;
    }
}
